name: Release afi

on:
  push:
    tags:
      - 'afi-v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: '11.0'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rust_target: aarch64-apple-darwin
            asset: afi-darwin-arm64
            binary: afi
            extension: tar.gz
          - os: macos-14
            rust_target: x86_64-apple-darwin
            asset: afi-darwin-x86_64
            binary: afi
            extension: tar.gz
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            asset: afi-linux-x86_64
            binary: afi
            extension: tar.gz
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            asset: afi-linux-arm64
            binary: afi
            extension: tar.gz
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset: afi-windows-x86_64
            binary: afi.exe
            extension: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/sync

      - name: Build
        run: cargo build --release --manifest-path apps/sync/Cargo.toml --target ${{ matrix.rust_target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "apps/sync/target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          archive="${{ matrix.asset }}.${{ matrix.extension }}"
          if [ "${{ matrix.extension }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.binary }}' -DestinationPath '$archive' -Force"
            powershell -NoProfile -Command "(Get-FileHash '$archive' -Algorithm SHA256).Hash.ToLower()" | tr -d '\r' > "$archive.sha256"
          else
            tar -C dist -czf "$archive" "${{ matrix.binary }}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"
            else
              shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.${{ matrix.extension }}
            ${{ matrix.asset }}.${{ matrix.extension }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
