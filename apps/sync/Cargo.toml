[package]
name = "afilmory-sync"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
description = "Afilmory Sync — watch folders and upload photos to Afilmory Edge"
license = "MIT"

[[bin]]
name = "afi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
notify = "8"
rand = "0.9"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
thumbhash = "0.1"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
webbrowser = "1"
zune-heic = "0.5"
